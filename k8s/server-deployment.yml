apiVersion: app/v1
kind: Deployment
metadata:
  name: server-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      component: server
  template:
    labels:
      component: server
    spec:
      containers:
        - name: server
          image: muhammadhaziq/multi-server-up
          ports:
            - containerPort: 5000
